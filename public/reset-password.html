<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09233f" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co; form-action 'self'" />
    <link rel="icon" type="image/png" href="./assets/bluecat-favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="./styles.css?v=supabase-2" rel="stylesheet" />
    <title>Nova senha | BlueCat Systems</title>
  </head>
  <body>
    <main class="login-screen">
      <div class="container login-panel">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="login-brand">
              <img src="./assets/bluecat-logo.png" alt="Logo BlueCat Systems" />
              <div><h1>BlueCat Systems</h1><p>Portal de Conhecimento</p></div>
            </div>
            <section class="login-card">
              <div class="mb-4"><span class="eyebrow">Recuperação de acesso</span><h2>Escolha uma nova senha</h2><p class="text-muted small mb-0">Use pelo menos 8 caracteres e confirme a senha para concluir.</p></div>
              <div id="reset-alert"><div class="alert alert-info py-2">Validando seu link de recuperação...</div></div>
              <form id="reset-form" class="d-none" novalidate>
                <div class="mb-3"><label class="form-label" for="new-password">Nova senha</label><input class="form-control" id="new-password" type="password" minlength="8" autocomplete="new-password" required /></div>
                <div class="mb-4"><label class="form-label" for="confirm-password">Confirmar nova senha</label><input class="form-control" id="confirm-password" type="password" minlength="8" autocomplete="new-password" required /></div>
                <button class="btn btn-primary w-100" id="reset-submit" type="submit">Salvar nova senha <i class="bi bi-arrow-right ms-2"></i></button>
              </form>
              <div id="reset-back" class="login-request-access d-none"><a class="btn btn-link p-0" href="./index.html">Ir para o login</a></div>
            </section>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script>
      (() => {
        const config = window.BLUECAT_CONFIG || {};
        const url = String(config.SUPABASE_URL || "").replace(/\/$/, "");
        const key = String(config.SUPABASE_ANON_KEY || "");
        const client = window.supabase && url && key ? window.supabase.createClient(url, key) : null;
        const alertBox = document.getElementById("reset-alert");
        const form = document.getElementById("reset-form");
        const submit = document.getElementById("reset-submit");
        const back = document.getElementById("reset-back");
        const escapeHtml = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        const showError = (message) => { alertBox.innerHTML = `<div class="alert alert-danger py-2">${escapeHtml(message)}</div>`; back.classList.remove("d-none"); };
        const showForm = () => { alertBox.innerHTML = ""; form.classList.remove("d-none"); };
        const waitForRecoverySession = async () => {
          if (!client) throw new Error("Serviço de autenticação não configurado.");
          const query = new URLSearchParams(window.location.search);
          const code = query.get("code");
          if (code) {
            const { error } = await client.auth.exchangeCodeForSession(code);
            if (error) throw error;
          }
          const current = await client.auth.getSession();
          if (current.data.session) return current.data.session;
          return new Promise((resolve, reject) => {
            let finished = false;
            const timeout = window.setTimeout(() => { if (!finished) { finished = true; subscription.unsubscribe(); reject(new Error("Este link de recuperação expirou ou já foi utilizado.")); } }, 8000);
            const { data: { subscription } } = client.auth.onAuthStateChange((event, session) => {
              if (event === "PASSWORD_RECOVERY" && session && !finished) {
                finished = true;
                window.clearTimeout(timeout);
                subscription.unsubscribe();
                resolve(session);
              }
            });
          });
        };
        (async () => {
          try {
            const hashParams = new URLSearchParams(window.location.hash.slice(1));
            const authError = hashParams.get("error_description") || new URLSearchParams(window.location.search).get("error_description");
            if (authError) throw new Error(authError.replaceAll("+", " "));
            await waitForRecoverySession();
            showForm();
          } catch (error) {
            showError(error.message || "Não foi possível validar o link de recuperação.");
          }
        })();
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const password = document.getElementById("new-password").value;
          const confirmation = document.getElementById("confirm-password").value;
          if (password !== confirmation) { showError("As senhas não conferem."); form.classList.remove("d-none"); return; }
          submit.disabled = true;
          submit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Salvando...`;
          const { error } = await client.auth.updateUser({ password });
          if (error) {
            showError(error.message);
            submit.disabled = false;
            submit.innerHTML = `Salvar nova senha <i class="bi bi-arrow-right ms-2"></i>`;
            return;
          }
          await client.auth.signOut();
          window.history.replaceState({}, document.title, "./reset-password.html");
          form.classList.add("d-none");
          alertBox.innerHTML = `<div class="alert alert-success py-2">Senha alterada com sucesso.</div>`;
          back.classList.remove("d-none");
        });
      })();
    </script>
  </body>
</html>
