<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09233f" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co; form-action 'self'" />
    <link rel="icon" type="image/png" href="./assets/bluecat-favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="./styles.css?v=supabase-2" rel="stylesheet" />
    <title>Esqueci minha senha | BlueCat Systems</title>
  </head>
  <body>
    <main class="login-screen">
      <div class="container login-panel">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="login-brand">
              <img src="./assets/bluecat-logo.png" alt="Logo BlueCat Systems" />
              <div><h1>BlueCat Systems</h1><p>Portal de Conhecimento</p></div>
            </div>
            <section class="login-card">
              <div class="mb-4"><span class="eyebrow">Recuperação de acesso</span><h2>Esqueceu sua senha?</h2><p class="text-muted small mb-0">Informe seu e-mail e enviaremos um link seguro para criar uma nova senha.</p></div>
              <div id="forgot-alert"></div>
              <form id="forgot-form" novalidate>
                <div class="mb-4"><label class="form-label" for="forgot-email">E-mail de acesso</label><input class="form-control" id="forgot-email" type="email" autocomplete="email" placeholder="voce@empresa.com.br" required maxlength="254" /></div>
                <button class="btn btn-primary w-100" id="forgot-submit" type="submit">Enviar link de recuperação <i class="bi bi-arrow-right ms-2"></i></button>
              </form>
              <div class="login-request-access"><a class="btn btn-link p-0" href="./index.html">Voltar para o login</a></div>
            </section>
            <p class="text-center text-muted mt-4 small">BlueCat Systems</p>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script>
      (() => {
        const config = window.BLUECAT_CONFIG || {};
        const url = String(config.SUPABASE_URL || "").replace(/\/$/, "");
        const key = String(config.SUPABASE_ANON_KEY || "");
        const alertBox = document.getElementById("forgot-alert");
        const submit = document.getElementById("forgot-submit");
        const escapeHtml = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        const showError = (message) => { alertBox.innerHTML = `<div class="alert alert-danger py-2">${escapeHtml(message)}</div>`; };
        const client = window.supabase && url && key ? window.supabase.createClient(url, key) : null;
        document.getElementById("forgot-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const email = document.getElementById("forgot-email").value.trim().toLowerCase();
          if (!client || !email) return;
          submit.disabled = true;
          submit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Enviando...`;
          const redirectTo = new URL("./reset-password.html", document.baseURI).href;
          const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
          if (error) {
            const limited = /rate limit|too many|email rate/i.test(error.message);
            showError(limited ? "O limite de envio de e-mails foi atingido. Aguarde e tente novamente mais tarde, sem repetir o pedido." : error.message);
            submit.disabled = false;
            submit.innerHTML = `Enviar link de recuperação <i class="bi bi-arrow-right ms-2"></i>`;
            return;
          }
          alertBox.innerHTML = `<div class="alert alert-success py-2">Se este e-mail estiver cadastrado, o link foi enviado. Verifique também a caixa de spam.</div>`;
          submit.disabled = true;
          submit.textContent = "Link solicitado";
        });
      })();
    </script>
  </body>
</html>
