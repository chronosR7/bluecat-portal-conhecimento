<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09233f" />
    <meta
      name="description"
      content="BlueCat Systems - Portal de Conhecimento"
    />
    <!-- GitHub Pages não aplica headers HTTP; a CSP fica declarada no documento. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-src https://www.youtube-nocookie.com; form-action 'self'"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="./assets/bluecat-favicon.png?v=2"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
    <title>BlueCat Systems - Portal de Conhecimento</title>
    <!-- Bootstrap fornece componentes; Bootstrap Icons fornece os ícones usados nos templates. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="./styles.css?v=supabase-1" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="app-root"></div>
    <div
      id="toast-region"
      class="toast-container position-fixed bottom-0 end-0 p-3"
    ></div>

    <div class="modal fade" id="entity-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" id="entity-modal-content"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- O SDK é usado pelo login e pelas sessões do Supabase Auth. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./app.js?v=supabase-1" defer></script>
  </body>
</html>
